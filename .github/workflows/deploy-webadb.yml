name: Deploy YiDream client site and Android console

on:
  push:
    branches: [ main, master ]
    paths:
      - 'site/client/**'
      - 'webadb/**'
      - 'app/**'
      - 'version.json'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/deploy-webadb.yml'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_signed: ${{ steps.signing.outputs.release_signed }}
    env:
      RELEASE_SIGNING: ${{ secrets.YIDREAM_KEYSTORE_BASE64 != '' && secrets.YIDREAM_KEY_ALIAS != '' && secrets.YIDREAM_KEY_PASSWORD != '' && secrets.YIDREAM_STORE_PASSWORD != '' }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier la signature avant publication
        id: signing
        run: |
          echo "release_signed=$RELEASE_SIGNING" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE_SIGNING" != "true" ]; then
            echo "::notice::Clé de signature durable absente : compilation de test uniquement. Le site et sa mise à jour ne seront pas remplacés par une APK signée avec une clé debug éphémère."
          fi

      - name: Vérifier la séparation YiDream et YZ
        run: |
          python3 tests/check-project-boundaries.py
          python3 -m unittest discover -s tests -p '*_test.py'

      # --- Compilation de l'APK Android, pour le bundler dans le site ---
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accepter les licences du SDK Android préinstallé
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Générer le gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Rendre gradlew exécutable
        run: chmod +x ./gradlew

      - name: Tester la vérification des mises à jour
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Conserver les captures et contrôles des écrans
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yidream-ui-previews
          path: |
            app/build/ui-previews
            app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Préparer la clé de signature
        if: env.RELEASE_SIGNING == 'true'
        env:
          YIDREAM_KEYSTORE_BASE64: ${{ secrets.YIDREAM_KEYSTORE_BASE64 }}
        run: echo "$YIDREAM_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yidream-release.jks"

      - name: Compiler l'APK signé
        if: env.RELEASE_SIGNING == 'true'
        env:
          ORG_GRADLE_PROJECT_yidreamStoreFile: ${{ runner.temp }}/yidream-release.jks
          ORG_GRADLE_PROJECT_yidreamStorePassword: ${{ secrets.YIDREAM_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_yidreamKeyAlias: ${{ secrets.YIDREAM_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_yidreamKeyPassword: ${{ secrets.YIDREAM_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Compiler l'APK installable de prévisualisation
        if: env.RELEASE_SIGNING != 'true'
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copier l'APK dans le site
        run: |
          if [ "$RELEASE_SIGNING" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk webadb/public/yidream.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk webadb/public/yidream.apk
          fi

      - name: Vérifier la signature de production conservée
        if: env.RELEASE_SIGNING == 'true'
        run: python3 tests/verify-apk-certificate.py webadb/public/yidream.apk signing-certificate.sha256

      - name: Décrire le type de signature pour le site
        run: |
          if [ "$RELEASE_SIGNING" = "true" ]; then
            echo '{"releaseSigned":true}' > webadb/public/yidream-build.json
          else
            echo '{"releaseSigned":false}' > webadb/public/yidream-build.json
          fi

      - name: Générer le manifeste avec l'empreinte de l'APK
        run: |
          sha256sum webadb/public/yidream.apk | cut -d ' ' -f1 > "$RUNNER_TEMP/yidream-apk.sha256"
          jq --rawfile apkSha "$RUNNER_TEMP/yidream-apk.sha256" '.apkSha256 = ($apkSha | gsub("\n"; ""))' version.json > "$RUNNER_TEMP/version.json"

      - name: Publier l'APK dans les artefacts GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: yidream-${{ env.RELEASE_SIGNING == 'true' && 'release' || 'preview' }}-v5.9.1
          path: webadb/public/yidream.apk
          if-no-files-found: error

      - name: Créer la version YiDream v5.9.1
        if: env.RELEASE_SIGNING == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.9.1
          name: YiDream v5.9.1
          body: |
            Nouveau design inspiré du site YiDream : fond clair, titres marine, cartes d’applications et boutons Installer bleus arrondis.
            Toutes les fonctions existantes sont conservées : association, installation et mises à jour, demandes de sites, langues, réglages et retrait du filtre protégé.
          files: webadb/public/yidream.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Compilation et déploiement des deux espaces ---
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les dépendances
        working-directory: webadb
        run: npm ci

      - name: Compiler le site administrateur
        working-directory: webadb
        run: npm run build

      - name: Assembler le site public et la console Android
        run: |
          mv webadb/dist "$RUNNER_TEMP/yidream-admin"
          mkdir -p webadb/dist/admin webadb/dist/icons
          cp -R "$RUNNER_TEMP/yidream-admin/." webadb/dist/admin/
          cp site/client/index.html webadb/dist/index.html
          cp webadb/assets/icons/yidream-original.png webadb/dist/icons/yidream-original.png
          cp "$RUNNER_TEMP/version.json" webadb/dist/version.json

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webadb/dist

  deploy:
    needs: build
    if: needs.build.outputs.release_signed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

