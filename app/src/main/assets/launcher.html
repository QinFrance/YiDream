<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>YiDream</title>
<style>
:root{color-scheme:dark;--bg:#101014;--card:#19191f;--card-hi:#202027;--line:#302f37;--text:#f5f3f8;--muted:#a8a5af;--accent:#d1b8e8;--blue:#7cbaff;--green:#c3dda8}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:16px/1.35 Roboto,"Noto Sans",Arial,sans-serif}body{padding:18px 20px calc(20px + env(safe-area-inset-bottom));display:flex;justify-content:center}.shell{width:min(100%,580px);min-height:calc(100dvh - 38px);display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;padding:13px 3px 21px}.eyebrow{font-size:11px;letter-spacing:2.2px;color:var(--muted);text-transform:uppercase}.brand{font-size:30px;letter-spacing:-1.2px;font-weight:700;margin-top:5px}.icon-button{width:48px;height:48px;border:1px solid var(--line);border-radius:50%;background:var(--card-hi);color:var(--accent);display:grid;place-items:center}.icon-button svg,.glyph svg,.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.apps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.tile{min-height:124px;padding:17px;border:1px solid var(--line);border-radius:23px;background:linear-gradient(145deg,#1d1c23,#17171d);color:var(--text);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left;font:inherit;cursor:pointer;transition:transform .12s,border-color .12s}.tile:active{transform:scale(.985)}.tile.primary{grid-column:1/-1;min-height:154px;padding:19px 20px;background:linear-gradient(120deg,#24212b,#19181e);border-color:#403a48}.glyph{width:43px;height:43px;border-radius:15px;background:#302a38;color:var(--accent);display:grid;place-items:center}.tile.primary .glyph{width:49px;height:49px;border-radius:17px}.tile-copy strong{display:block;font-size:17px;line-height:1.15;font-weight:650}.tile-copy small{display:block;margin-top:5px;color:var(--muted);font-size:12px}.tile.waze .glyph{background:#24384a;color:#64b6ff}.tile.pulsar .glyph{background:#2c2836}.tile.bluetooth .glyph,.tile.settings .glyph{background:#292730}.music{margin-top:auto;padding-top:18px}.player{height:68px;padding:9px 13px;border-radius:21px;background:#211f27;display:flex;align-items:center;gap:12px;border:0;color:var(--text);text-align:left;width:100%;font:inherit;cursor:pointer}.player .glyph{width:46px;height:46px;flex:none}.player-copy{flex:1;min-width:0}.player-copy strong{display:block;font-size:14px}.player-copy small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.play{font-size:24px;color:#e9e5ee;padding:0 5px}.nav{height:53px;margin-top:7px;display:flex;align-items:center;justify-content:space-around;color:#8e8997}.nav button{width:54px;height:43px;border:0;background:transparent;color:inherit;display:grid;place-items:center}.nav button:first-child{color:var(--accent)}.notice{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#302e36;border:1px solid #514d59;padding:10px 15px;border-radius:99px;font-size:12px;white-space:nowrap;transition:.18s}.notice.show{opacity:1;transform:translate(-50%,0)}
@media (orientation:landscape) and (min-width:650px){body{padding:16px 28px}.shell{width:min(100%,1050px);min-height:calc(100dvh - 32px)}.top{padding:4px 8px 16px}.brand{font-size:27px}.apps{grid-template-columns:1.15fr .85fr 1fr;grid-template-rows:minmax(160px,1fr) minmax(95px,.62fr);gap:14px}.tile{min-height:0;padding:17px 19px;border-radius:24px}.tile.primary{grid-column:1;grid-row:1/3;min-height:0}.tile.waze{grid-column:2;grid-row:1}.tile.pulsar{grid-column:3;grid-row:1}.tile.bluetooth{grid-column:2;grid-row:2}.tile.settings{grid-column:3;grid-row:2}.tile-copy strong{font-size:19px}.tile.primary .tile-copy strong{font-size:24px}.tile-copy small{font-size:13px}.music{padding-top:13px}.player{height:62px}.nav{height:40px;margin-top:5px}}
@media (max-height:500px) and (orientation:landscape){.shell{min-height:calc(100dvh - 24px)}.top{padding-bottom:9px}.apps{grid-template-rows:minmax(125px,1fr) minmax(78px,.55fr)}.tile{padding:12px 16px}.tile.primary .glyph{width:40px;height:40px}.music{padding-top:8px}.player{height:53px}.player .glyph{width:39px;height:39px}.nav{height:30px}}
</style>
</head>
<body>
<main class="shell">
<header class="top"><div><div class="eyebrow" id="mode">VOTRE APPAREIL MUSICAL</div><div class="brand" id="brand">YiDream</div></div><button class="icon-button" aria-label="Réglages Android" onclick="nativeCall('openSettings')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 13.5a7.8 7.8 0 0 0 0-3l2-1.2-2-3.4-2.2 1a8 8 0 0 0-2.6-1.5L14 3h-4l-.4 2.4A8 8 0 0 0 7 6.9l-2.2-1-2 3.4 2 1.2a7.8 7.8 0 0 0 0 3l-2 1.2 2 3.4 2.2-1a8 8 0 0 0 2.6 1.5L10 21h4l.4-2.4a8 8 0 0 0 2.6-1.5l2.2 1 2-3.4z"/></svg></button></header>
<section class="apps" aria-label="Applications">
<button class="tile primary" onclick="nativeCall('openApp','Zemer')"><span class="glyph"><svg viewBox="0 0 24 24"><path d="M14 3v12.1a3.7 3.7 0 1 1-2-3.3V7h8V3z"/></svg></span><span class="tile-copy"><strong>Zemer</strong><small>Musique en ligne</small></span></button>
<button class="tile waze" onclick="nativeCall('openApp','Waze')"><span class="glyph"><svg viewBox="0 0 32 32" style="fill:currentColor;stroke:none"><path d="M16 3.4C8.8 3.4 3 8.2 3 14.5c0 5.3 4.3 9.6 10.1 10.5L11 29l8.1-3.8c5.8-1.1 9.9-5.2 9.9-10.7C29 8.2 23.2 3.4 16 3.4Z"/><circle cx="11.6" cy="14" r="1.45" fill="#17202b" stroke="none"/><circle cx="20.4" cy="14" r="1.45" fill="#17202b" stroke="none"/><path d="M11.5 18.1c2.4 2.2 6.6 2.2 9 0" style="fill:none;stroke:#17202b;stroke-width:1.5"/></svg></span><span class="tile-copy"><strong>Waze</strong><small>Navigation</small></span></button>
<button class="tile pulsar" onclick="nativeCall('openApp','Pulsar')"><span class="glyph"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span><span class="tile-copy"><strong>Pulsar</strong><small>Musique locale</small></span></button>
<button class="tile bluetooth" onclick="nativeCall('openBluetooth')"><span class="glyph"><svg viewBox="0 0 24 24"><path d="M12 2v20l7-5.5-7-4.5 7-6-7-4ZM5 7l14 14M5 17 19 3"/></svg></span><span class="tile-copy"><strong>Bluetooth</strong><small>Casque et autoradio</small></span></button>
<button class="tile settings" onclick="nativeCall('openSettings')"><span class="glyph"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 13.5a7.8 7.8 0 0 0 0-3l2-1.2-2-3.4-2.2 1a8 8 0 0 0-2.6-1.5L14 3h-4l-.4 2.4A8 8 0 0 0 7 6.9l-2.2-1-2 3.4 2 1.2a7.8 7.8 0 0 0 0 3l-2 1.2 2 3.4 2.2-1a8 8 0 0 0 2.6 1.5L10 21h4l.4-2.4a8 8 0 0 0 2.6-1.5l2.2 1 2-3.4z"/></svg></span><span class="tile-copy"><strong>Réglages</strong><small>Paramètres du téléphone</small></span></button>
</section>
<section class="music"><button class="player" onclick="nativeCall('openApp','Zemer')"><span class="glyph"><svg viewBox="0 0 24 24"><path d="M14 3v12.1a3.7 3.7 0 1 1-2-3.3V7h8V3z"/></svg></span><span class="player-copy"><strong>Votre musique</strong><small>Ouvrir le lecteur</small></span><span class="play" aria-hidden="true">▷</span></button><nav class="nav" aria-label="Navigation"><button aria-label="Accueil"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></button><button aria-label="Musique" onclick="nativeCall('openApp','Zemer')"><svg viewBox="0 0 24 24"><path d="M14 3v12.1a3.7 3.7 0 1 1-2-3.3V7h8V3z"/></svg></button><button aria-label="Réglages" onclick="nativeCall('openSettings')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 13.5a7.8 7.8 0 0 0 0-3l2-1.2-2-3.4-2.2 1a8 8 0 0 0-2.6-1.5L14 3h-4l-.4 2.4A8 8 0 0 0 7 6.9l-2.2-1-2 3.4 2 1.2a7.8 7.8 0 0 0 0 3l-2 1.2 2 3.4 2.2-1a8 8 0 0 0 2.6 1.5L10 21h4l.4-2.4a8 8 0 0 0 2.6-1.5l2.2 1 2-3.4z"/></svg></button></nav></section>
</main><div class="notice" id="notice" role="status"></div>
<script>
(function(){var mode=document.getElementById('mode');function orientation(){mode.textContent=window.matchMedia('(orientation: landscape)').matches?'MODE VOITURE':'VOTRE APPAREIL MUSICAL'}window.addEventListener('orientationchange',orientation);window.addEventListener('resize',orientation);orientation();window.yidreamNotice=function(message){var n=document.getElementById('notice');n.textContent=message;n.classList.add('show');setTimeout(function(){n.classList.remove('show')},2200)};window.nativeCall=function(name,arg){try{if(window.YiDream&&typeof window.YiDream[name]==='function'){if(arg===undefined)window.YiDream[name]();else window.YiDream[name](arg);return}}catch(e){}window.yidreamNotice('Cette action est disponible sur le téléphone.')};document.getElementById('brand').addEventListener('click',function(){if(window.YiDream)window.YiDream.titleTap()})})();
</script>
</body>
</html>
