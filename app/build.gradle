plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.yidream.mdm'
    compileSdk 34

    defaultConfig {
        applicationId "com.yidream.mdm"
        minSdk 26
        targetSdk 34
        versionCode 16
        versionName "v5.9"
    }

    signingConfigs {
        release {
            def releaseStoreFile = project.findProperty('yidreamStoreFile')
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                storePassword project.findProperty('yidreamStorePassword')
                keyAlias project.findProperty('yidreamKeyAlias')
                keyPassword project.findProperty('yidreamKeyPassword')
            }
        }
    }

    buildTypes {
        release {
            if (project.hasProperty('yidreamStoreFile')) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                maxHeapSize = '2g'
                systemProperty 'java.awt.headless', 'true'
                systemProperty 'yidream.uiPreviewDir', file("$buildDir/ui-previews").absolutePath
            }
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
}

